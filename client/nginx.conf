server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ── 安全响应头（HTML 文档 + 静态资源）───────────────────────────
    # 注意：nginx 的 add_header 在同一 location 内有自定义 add_header 时不会继承
    # server 级配置，因此每个 location 需显式重复这些头。
    # CSP 放在 HTML 响应上才有实际防护意义（约束可加载的脚本/样式源）。
    # CSP：script 仅 self（Vite 构建为外部 JS），style 允许 inline（CodeMirror），
    # connect 同源（API），frame-ancestors none（防点击劫持）。
    # ───────────────────────────────────────────────────────────────
    location / {
        # HTML/入口：不缓存，确保用户始终拿到最新的 index.html（引用最新 hash JS）
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri $uri/ /index.html;
    }

    # 静态资源（带 hash）：长缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri $uri/ /index.html;
    }

    # API proxy（安全头由后端 Express 统一添加，避免重复；透传客户端真实 IP 与协议）
    location /api/ {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
